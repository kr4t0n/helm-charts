{{- if not (include "open-design.useExistingSecret" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-design.fullname" . }}
type: Opaque
data:
  {{- if .Values.config.apiToken }}
  OD_API_TOKEN: {{ .Values.config.apiToken | b64enc | quote }}
  {{- else }}
  {{- fail "CRITICAL ERROR: config.apiToken cannot be empty. Set config.apiToken, or set existingSecret.enabled=true and existingSecret.name to read the token from your own Secret." }}
  {{- end }}
{{- end -}}
