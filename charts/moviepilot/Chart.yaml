apiVersion: v2
name: moviepilot
description: A Helm chart for Kubernetes

type: application
# Minor follows the common library's minor; the patch counts this chart's releases.
version: 0.6.1
# Latest tag of jxxghp/moviepilot-v2; 2.15.6 is the last V2 release. V3 ships as
# a separate image (jxxghp/moviepilot-v3) with a database migration — moving to
# it is a deliberate upgrade, not a tag bump. Used as the image tag whenever
# values.yaml image.tag is empty.
appVersion: 2.15.6

dependencies:
  - name: common
    version: ">=0.6.0 <0.7.0"
    repository: file://../common
