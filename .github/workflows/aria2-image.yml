name: aria2 image

on:
  push:
    branches:
      - main
    paths:
      - images/aria2/**
      - .github/workflows/aria2-image.yml
  pull_request:
    paths:
      - images/aria2/**
      - .github/workflows/aria2-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read aria2 version
        id: version
        run: echo "aria2=$(tr -d '[:space:]' < images/aria2/VERSION)" >> "$GITHUB_OUTPUT"

      # The final stage installs Alpine packages, which runs the arm64 build under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/aria2
          # The aria2 version is the release tag; the sha tag traces a rebuild of
          # the same version (AriaNg or base image bump) back to its commit.
          tags: |
            type=raw,value=${{ steps.version.outputs.aria2 }}
            type=sha

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/aria2
          platforms: linux/amd64,linux/arm64
          build-args: ARIA2_VERSION=${{ steps.version.outputs.aria2 }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
