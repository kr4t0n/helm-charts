# Serves AriaNg and proxies /jsonrpc to aria2c on one port, as any uid. Every
# path nginx writes is under /tmp.
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Torrent and metalink uploads arrive base64-encoded in the RPC body.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        root /usr/share/ariang;

        # HTTP and WebSocket RPC.
        location = /jsonrpc {
            proxy_pass http://127.0.0.1:6800;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }
    }
}
