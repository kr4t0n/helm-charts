name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    # depending on your permissions, you may need to grant write access
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.10.0

      # Charts that use the in-repo `common` library declare it as a file://
      # dependency. chart-releaser packages with `helm package`, which requires
      # the dependency to be vendored into each chart's charts/ dir first.
      - name: Vendor chart dependencies
        run: |
          for chart in charts/*/; do
            if grep -qE '^dependencies:' "${chart}Chart.yaml" 2>/dev/null; then
              echo "==> helm dependency update ${chart}"
              helm dependency update "${chart}"
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.5.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
