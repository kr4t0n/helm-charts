apiVersion: v2
name: aria2
description: aria2 download daemon with the AriaNg web UI, using the kr4t0n/aria2 image built in this repo.

type: application
# Minor follows the common library's minor; the patch counts this chart's releases.
version: 0.6.1
# The aria2 release in images/aria2/VERSION. The deployed image tag while
# values.yaml image.tag is empty.
appVersion: "1.37.0"
home: https://aria2.github.io/
sources:
  - https://github.com/kr4t0n/helm-charts/tree/main/images/aria2
  - https://github.com/aria2/aria2
  - https://github.com/mayswind/AriaNg
keywords:
  - aria2
  - ariang
  - downloader
maintainers:
  - name: kr4t0n
    url: https://github.com/kr4t0n

dependencies:
  - name: common
    version: ">=0.6.0 <0.7.0"
    repository: file://../common
