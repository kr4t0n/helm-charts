apiVersion: v2
name: plex
description: A Helm chart for Kubernetes

type: application
# Minor follows the common library's minor; the patch counts this chart's releases.
version: 0.6.2
# Plex2Shell (CVE-2026-96652/96654/96655/96656) is fixed from 1.43.3.10861; do
# not pin anything older. Used as the image tag whenever values.yaml image.tag
# is empty.
appVersion: 1.43.5.11079-b3b13e506

dependencies:
  - name: common
    # The defaults need `strategy` (0.4.0+); floored at the current release.
    version: ">=0.6.0 <0.7.0"
    repository: file://../common
