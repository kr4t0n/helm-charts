name: Lint Charts

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Every branch and tag with full history, for the secret scan.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # The whole history, not just the PR's diff: the repo is public, so a
      # secret committed and later deleted is still exposed. Uses .gitleaks.toml.
      - name: Scan git history for secrets
        run: gitleaks git --redact --verbose --no-banner .

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2
          token: ${{ github.token }}

      # Lint every chart, and render application charts, so broken templates or
      # missing/mis-ignored dependencies fail the PR instead of the release.
      - name: Lint and template charts
        run: |
          fail=0
          for chart in charts/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            name=$(basename "$chart")
            echo "::group::$name"
            if grep -qE '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency update "$chart" || { echo "::error::dependency build failed for $name"; fail=1; }
            fi
            # Charts with required values (no usable defaults) ship ci/*.yaml.
            values=()
            for f in "${chart}"ci/*.yaml; do
              if [ -f "$f" ]; then values+=(-f "$f"); fi
            done
            helm lint "$chart" "${values[@]}" || { echo "::error::helm lint failed for $name"; fail=1; }
            # Library charts can't be rendered standalone; only template apps.
            if ! grep -qE '^type:[[:space:]]*library' "${chart}Chart.yaml"; then
              helm template "$name" "$chart" "${values[@]}" >/dev/null || { echo "::error::helm template failed for $name"; fail=1; }
            fi
            echo "::endgroup::"
          done
          exit $fail
