# Default values for photoprism.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: photoprism/photoprism
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion (260728) is used.
  #
  # Deliberately NOT `latest`. PhotoPrism's release tags are date stamps, and a
  # mutable `latest` combined with `pullPolicy: IfNotPresent` means the version
  # you get depends on which node the pod lands on and what that node has
  # cached. A reschedule then silently jumps the server forward by months and
  # runs irreversible schema migrations on startup, during which PhotoPrism does
  # not bind its HTTP port at all. Pin the tag so upgrades are a deliberate act.
  tag: ""

service:
  type: ClusterIP
  port: 2342

# PhotoPrism resolves its config and assets relative to this directory.
workingDir: /photoprism

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Each entry may be `- host: name`, `- name` (bare string), or
  # `- host: name` with a `paths:` list. Default path is "/".
  hosts: []
  #   - host: photoprism.example.com
  tls: []
  #   - hosts:
  #       - photoprism.example.com
  #     secretName: photoprism-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    storage:
      # Sidecar files, thumbnails, the index database and cache. This is
      # PhotoPrism's own state — it is NOT your photo library.
      mountPath: /photoprism/storage
      # Empty suffix => PVC is named exactly "<release>", matching the
      # pre-library chart so existing PVCs are reused on upgrade.
      claimNameSuffix: ""

# PhotoPrism binds its HTTP port only *after* it finishes any schema migrations
# the running version requires. Without a readiness probe the pod reports Ready
# as soon as the process starts, so the Service routes traffic to a closed port
# and callers see connection refused for the whole migration window (observed:
# ~8.5 minutes on a version jump). These probes keep the pod out of the Service
# until it actually answers.
#
# `/readyz` and `/healthz` are PhotoPrism's own unauthenticated health
# endpoints, so they work with PHOTOPRISM_AUTH_MODE=password.
probes:
  # Tolerates a ~15 minute first boot before the pod is declared failed. Size
  # this to the worst migration you expect, not the typical start: a jump
  # across several releases replays every intervening schema change.
  startup:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    failureThreshold: 90
  readiness:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # No liveness probe on purpose. PhotoPrism runs long indexing and face
  # recognition passes that can stop answering promptly under load, and a
  # liveness failure would restart the container mid-pass. Add one only if you
  # actually observe hangs — the startup probe above already guards it.

resources: {}
  # requests:
  #   cpu: 500m
  #   memory: 1Gi
  # limits:
  #   cpu: "4"
  #   memory: 4Gi

# Node selector for pod scheduling. Indexing is CPU-heavy and the storage
# volume is ReadWriteOnce, so pinning the pod to one node is common.
nodeSelector: {}
  # kubernetes.io/os: linux

tolerations: []
affinity: {}

# Additional environment variables. PhotoPrism is configured almost entirely
# through PHOTOPRISM_* vars — see https://docs.photoprism.app/getting-started/config-options/
extraEnvs: []
  # - name: PHOTOPRISM_SITE_URL
  #   value: "https://photoprism.example.com/"
  # - name: PHOTOPRISM_ORIGINALS_LIMIT
  #   value: "5000"

# Load ALL keys from an existing secret as environment variables. Use this for
# PHOTOPRISM_ADMIN_PASSWORD and database credentials rather than extraEnvs.
existingSecret:
  enabled: false
  name: ""

# Mount your photo library at /photoprism/originals (and any other volumes).
# The originals volume is intentionally not managed by this chart — it is
# usually a pre-existing PVC, NFS export or hostPath shared with other apps.
extraVolumes: []
  # - name: photo-volume
  #   persistentVolumeClaim:
  #     claimName: photo

extraVolumeMounts: []
  # - name: photo-volume
  #   mountPath: /photoprism/originals
