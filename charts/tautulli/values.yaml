# Default values for tautulli.
# Rendering is delegated to the `common` library chart; this file only
# supplies the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: linuxserver/tautulli
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion (2.17.2) is used, pinning the deploy to a
  # reproducible tag. This is the same image `latest` currently resolves to
  # (identical digest), so it's a no-op for what runs today.
  tag: ""

service:
  type: ClusterIP
  port: 8181

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tautulli.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: tautulli-tls
  #   hosts:
  #     - tautulli.example.com

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  volumes:
    config:
      mountPath: /config
      size: 1Gi
      # Empty suffix => PVC is named exactly "<release>" (e.g. "tautulli"),
      # matching the pre-library chart so existing Longhorn PVCs are reused.
      claimNameSuffix: ""

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

# Node selector for pod scheduling
nodeSelector: {}
  # kubernetes.io/os: linux

tolerations: []
affinity: {}

# Additional environment variables (full Kubernetes env shape).
extraEnvs: []
  # - name: TZ
  #   value: "America/New_York"
