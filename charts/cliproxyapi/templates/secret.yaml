{{- if not .Values.existingConfigSecret }}
{{- if not (dig "access" "api-keys" list (.Values.config | default dict)) }}
{{- fail "cliproxyapi: set config.access.api-keys, or existingConfigSecret. Without client keys the proxy serves every request unauthenticated." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cliproxyapi.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
data:
  config.yaml: {{ include "cliproxyapi.config" . | b64enc }}
{{- end }}
