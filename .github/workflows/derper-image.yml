name: derper image

on:
  push:
    branches:
      - main
    paths:
      - images/derper/**
      - .github/workflows/derper-image.yml
  pull_request:
    paths:
      - images/derper/**
      - .github/workflows/derper-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Tailscale version
        id: version
        run: echo "tailscale=$(tr -d '[:space:]' < images/derper/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/derper
          # The Tailscale version is the release tag; the sha tag traces a rebuild of
          # the same version (base image bump, Dockerfile change) back to its commit.
          tags: |
            type=raw,value=${{ steps.version.outputs.tailscale }}
            type=sha

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/derper
          platforms: linux/amd64,linux/arm64
          build-args: TAILSCALE_VERSION=${{ steps.version.outputs.tailscale }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
