# Default values for calibre-web.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: linuxserver/calibre-web
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used (pins the deploy). This is the same
  # image `latest` currently resolves to (identical digest).
  tag: ""

service:
  type: ClusterIP
  port: 8083

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: calibre.example.com
  tls: []
  #   - hosts:
  #       - calibre.example.com
  #     secretName: calibre-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    config:
      mountPath: /config
      # Empty suffix => PVC is named exactly "<release>".
      claimNameSuffix: ""

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   cpu: "2"
  #   memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables.
extraEnvs: []
  # - name: TZ
  #   value: "America/New_York"

# Load ALL keys from an existing secret as environment variables.
existingSecret:
  enabled: false
  name: ""

# Mount your Calibre library (and any other volumes) into the pod.
extraVolumes: []
  # - name: books
  #   nfs:
  #     server: nfs-server.example.com
  #     path: /mnt/books

extraVolumeMounts: []
  # - name: books
  #   mountPath: /books
