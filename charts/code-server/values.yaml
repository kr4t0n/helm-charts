# Default values for code-server.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: linuxserver/code-server
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used (pins the deploy). This is the same
  # image `latest` currently resolves to (identical digest).
  tag: ""

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: code.example.com
  tls: []
  #   - hosts:
  #       - code.example.com
  #     secretName: code-server-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    config:
      mountPath: /config
      # Empty suffix => PVC is named exactly "<release>".
      claimNameSuffix: ""

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   cpu: "2"
  #   memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables (e.g. PASSWORD, SUDO_PASSWORD, DEFAULT_WORKSPACE).
extraEnvs: []
  # - name: TZ
  #   value: "America/New_York"

# Load ALL keys from an existing secret as environment variables
# (handy for PASSWORD / SUDO_PASSWORD).
existingSecret:
  enabled: false
  name: ""

# Free-form extra volumes / mounts (e.g. project directories).
extraVolumes: []
extraVolumeMounts: []
