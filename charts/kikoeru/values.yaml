# Default values for kikoeru.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: number17/kikoeru
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used (pins the deploy). This is the same
  # image `latest` currently resolves to (identical digest).
  tag: ""

service:
  type: ClusterIP
  port: 8888

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: kikoeru.example.com
  tls: []
  #   - hosts:
  #       - kikoeru.example.com
  #     secretName: kikoeru-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  # Default request size; each volume below inherits it unless it sets its own.
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    # PVC "<release>-sqlite", the application database
    sqlite:
      mountPath: /usr/src/kikoeru/sqlite
    # PVC "<release>-covers", cover-art cache
    covers:
      mountPath: /usr/src/kikoeru/covers
    # PVC "<release>-config", config files
    config:
      mountPath: /usr/src/kikoeru/config

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   cpu: "2"
  #   memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables.
extraEnvs: []
  # - name: TZ
  #   value: "America/New_York"

# Load ALL keys from an existing secret as environment variables.
existingSecret:
  enabled: false
  name: ""

# Mount your audio library (and any other volumes) into the pod.
extraVolumes: []
  # - name: media
  #   nfs:
  #     server: nfs-server.example.com
  #     path: /mnt/audio

extraVolumeMounts: []
  # - name: media
  #   mountPath: /media
