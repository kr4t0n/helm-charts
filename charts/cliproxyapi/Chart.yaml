apiVersion: v2
name: cliproxyapi
description: >-
  CLIProxyAPI, which serves OAuth-backed coding-assistant subscriptions (Codex,
  Claude Code, Antigravity, Grok and more) as OpenAI-, Gemini- and
  Claude-compatible APIs.

type: application
# Minor follows the common library's minor; the patch counts this chart's releases.
version: 0.6.1
# The upstream release tag, which is also the image tag. The deployed image tag
# while values.yaml image.tag is empty.
appVersion: "v8.1.0"
home: https://help.router-for.me/
sources:
  - https://github.com/router-for-me/CLIProxyAPI
  - https://hub.docker.com/r/eceasy/cli-proxy-api
keywords:
  - cliproxyapi
  - llm
  - openai
  - proxy
maintainers:
  - name: kr4t0n
    url: https://github.com/kr4t0n

dependencies:
  - name: common
    version: ">=0.6.0 <0.7.0"
    repository: file://../common
