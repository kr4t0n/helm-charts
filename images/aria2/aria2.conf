# Image defaults. Options given on the command line override them.

dir=/downloads
input-file=/config/aria2.session
save-session=/config/aria2.session
save-session-interval=30
dht-file-path=/config/dht.dat
dht-file-path6=/config/dht6.dat

enable-rpc=true
rpc-listen-port=6800
# Only nginx, in the same container, talks to the RPC port.
rpc-listen-all=false

# Resume partial downloads after a restart.
continue=true
# The default, prealloc, writes every file in full before downloading it, which
# is slow on network storage; falloc fails where fallocate is unsupported (NFSv3).
file-allocation=none
# Pod networks are usually IPv4-only, and failed IPv6 attempts slow every connection.
disable-ipv6=true
# The periodic progress summary and ANSI colours only add log noise in a container.
summary-interval=0
enable-color=false
