# Default values for qbittorrent.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: linuxserver/qbittorrent
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used (pins the deploy).
  tag: ""

service:
  type: ClusterIP
  # Web UI port.
  port: 8080

# Extra container ports beyond the web UI. The BitTorrent listen port is
# declared on the pod here; it is NOT added to the Service (matches the previous
# chart). Add a matching `service.extraPorts` entry if you need to expose it.
extraPorts:
  - name: bttcp
    containerPort: 6881
    protocol: TCP
  - name: btudp
    containerPort: 6881
    protocol: UDP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: qbittorrent.example.com
  tls: []
  #   - hosts:
  #       - qbittorrent.example.com
  #     secretName: qbittorrent-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  size: 4Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    config:
      mountPath: /config
      # Empty suffix => PVC is named exactly "<release>".
      claimNameSuffix: ""

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   cpu: "2"
  #   memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables (e.g. WEBUI_PORT, TZ).
extraEnvs: []
  # - name: TZ
  #   value: "America/New_York"

# Load ALL keys from an existing secret as environment variables.
existingSecret:
  enabled: false
  name: ""

# Mount your downloads directory (and any other volumes) into the pod.
extraVolumes: []
  # - name: downloads
  #   nfs:
  #     server: nfs-server.example.com
  #     path: /mnt/downloads

extraVolumeMounts: []
  # - name: downloads
  #   mountPath: /downloads
