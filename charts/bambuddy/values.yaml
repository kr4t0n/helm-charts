# Default values for bambuddy.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: maziggy/bambuddy
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used, pinning the deploy.
  tag: ""

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: bambuddy.example.com
  tls: []
  #   - hosts:
  #       - bambuddy.example.com
  #     secretName: bambuddy-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  # Default request size; each volume below inherits it unless it sets its own.
  size: 4Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    # PVC "<release>-data", mounted at /app/data
    data:
      mountPath: /app/data
    # PVC "<release>-logs", mounted at /app/logs
    logs:
      mountPath: /app/logs

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   cpu: "2"
  #   memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables.
extraEnvs: []
  # - name: TZ
  #   value: "America/New_York"

# Load ALL keys from an existing secret as environment variables.
existingSecret:
  enabled: false
  name: ""

# Free-form extra volumes / mounts.
extraVolumes: []
extraVolumeMounts: []
