# Default values for moviepilot.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: jxxghp/moviepilot-v2
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used (pins the deploy).
  tag: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: moviepilot.example.com
  tls: []
  #   - hosts:
  #       - moviepilot.example.com
  #     secretName: moviepilot-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  # Default request size; the config volume inherits it, playwright overrides.
  size: 4Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    # PVC "<release>", main config/data
    config:
      mountPath: /config
      claimNameSuffix: ""
    # PVC "<release>-playwright", the Playwright browser cache
    playwright:
      mountPath: /moviepilot/.cache/ms-playwright
      size: 1Gi

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 512Mi
  # limits:
  #   cpu: "2"
  #   memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables.
extraEnvs: []
  # - name: TZ
  #   value: "America/New_York"

# Load ALL keys from an existing secret as environment variables.
existingSecret:
  enabled: false
  name: ""

# Free-form extra volumes / mounts (e.g. a media library).
extraVolumes: []
extraVolumeMounts: []
