# Default values for registry.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: registry
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used (pins the deploy). This is the same
  # image `latest` currently resolves to (3.1.x).
  tag: ""

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: registry.example.com
  tls: []
  #   - hosts:
  #       - registry.example.com
  #     secretName: registry-tls   # optional; omit when the controller manages certs
  # path: /            # optional, default "/"
  # pathType: Prefix   # optional, default "Prefix"

persistence:
  # Registry stores pushed images under /var/lib/registry, backed by a PVC so
  # they survive pod restarts/rescheduling. Set enabled: false for an ephemeral
  # registry (images on the container filesystem, lost on restart).
  enabled: true
  storageClass: ""
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    data:
      mountPath: /var/lib/registry

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: "2"
  #   memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables (registry config via REGISTRY_* vars).
extraEnvs: []
  # - name: REGISTRY_STORAGE_DELETE_ENABLED
  #   value: "true"

# Load ALL keys from an existing secret as environment variables.
existingSecret:
  enabled: false
  name: ""

# Free-form extra volumes / mounts (e.g. a config.yml or alternate storage).
extraVolumes: []
extraVolumeMounts: []
