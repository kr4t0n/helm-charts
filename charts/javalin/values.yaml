# Default values for javalin.
# Rendering is delegated to the `common` library chart; this file only supplies
# the per-application data. See charts/common for the full template.

replicaCount: 1

image:
  repository: kr4t0n/javalin
  pullPolicy: IfNotPresent
  # Empty => the chart's appVersion is used. The published image also carries
  # immutable `sha-<short>` tags; pin one of those to keep a deploy identical
  # across restarts.
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# javalin's job store and its curl_cffi session live in the FastAPI process and
# are not designed to share state, so this chart runs a single replica.
# `Recreate` is what makes that safe on upgrade: the default rolling update
# would start the replacement before retiring the old pod, and the two would
# race for the same ReadWriteOnce volume.
strategy:
  type: Recreate

podSecurityContext:
  # Defaults track the image's baked-in user (uid 1000, gid 100) which is the
  # standard NAS / home-server convention. Override if your host filesystem
  # numbers differently — fsGroup must match the gid that owns the mounted PVC.
  runAsUser: 1000
  runAsGroup: 100
  fsGroup: 100
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 100

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: javalin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: javalin-tls
  #   hosts:
  #     - javalin.example.com

# All three probes ping /api/outputs — the same cheap heartbeat the SPA uses for
# its top-bar status pill and the same endpoint the Dockerfile's HEALTHCHECK
# targets. The startup probe is what makes the liveness probe safe: liveness
# counts from container start, so without it a slow first boot would be killed
# and retried rather than waited out.
probes:
  startup:
    httpGet:
      path: /api/outputs
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  liveness:
    httpGet:
      path: /api/outputs
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/outputs
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Persistent volume for the data directory (inputs/ and outputs/ live here).
persistence:
  enabled: true
  # Cluster default StorageClass when empty.
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  volumes:
    data:
      # Must match JAVALIN_DATA in extraEnvs below.
      mountPath: /data
      # Empty suffix => PVC is named exactly "<release>".
      claimNameSuffix: ""
      # Mount a pre-existing claim instead of creating one:
      # existingClaim: my-javalin-data
      # annotations: {}

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Environment for the container. JAVALIN_DATA must agree with the mountPath of
# the `data` volume above.
#
# javalin's scraper uses curl_cffi (libcurl), which honours the standard proxy
# variables natively. Set both the upper- and lower-case spellings so other
# Python HTTP libraries pick them up too — useful when javdb.com is unreachable
# from the cluster's egress. Inside a cluster you usually also want
# NO_PROXY/no_proxy set to at least
# "localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local".
extraEnvs:
  - name: JAVALIN_DATA
    value: /data
  # - name: HTTP_PROXY
  #   value: "http://proxy.example.com:8080"
  # - name: http_proxy
  #   value: "http://proxy.example.com:8080"
  # - name: HTTPS_PROXY
  #   value: "http://proxy.example.com:8080"
  # - name: https_proxy
  #   value: "http://proxy.example.com:8080"
  # - name: NO_PROXY
  #   value: "localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local"
  # - name: no_proxy
  #   value: "localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local"

# Load ALL keys of an existing Secret as environment variables.
existingSecret:
  enabled: false
  name: ""

extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
  # Image is multi-arch (amd64 + arm64); set this only if you want to
  # constrain scheduling for other reasons.

tolerations: []
affinity: {}
