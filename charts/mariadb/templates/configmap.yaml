apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  my.cnf: |
    [mariadb]
    # The data volume's root is the datadir, and its filesystem may hold lost+found.
    ignore_db_dirs=lost+found
    {{- with .Values.config }}
    {{- . | nindent 4 }}
    {{- end }}
