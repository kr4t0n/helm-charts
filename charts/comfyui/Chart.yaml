apiVersion: v2
name: comfyui
description: A Helm chart for Kubernetes

type: application
# Minor follows the common library's minor; the patch counts this chart's releases.
version: 0.6.1
# yanwk/comfyui-boot bundles the newest ComfyUI *stable* release available when
# the image is built, so appVersion tracks the bundle rather than the image tag
# (which is `cpu-<builddate>`). The deployed tag comes from values.yaml image.tag.
appVersion: "0.33.1"

dependencies:
  - name: common
    version: ">=0.6.0 <0.7.0"
    repository: file://../common
