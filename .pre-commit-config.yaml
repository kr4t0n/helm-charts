# Install once per clone: `pre-commit install`. Needs pre-commit and gitleaks on PATH.
# The gitleaks hooks declare no minimum, and 3.2.0 is the floor the other kr4t0n repos use.
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged changes with .gitleaks.toml. Upstream's gitleaks-system leaves
      # pass_filenames on, which makes gitleaks take a staged file as its repo path.
      - id: gitleaks-system
        pass_filenames: false
